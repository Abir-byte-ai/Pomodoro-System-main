<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Time Management & Pomodoro Tracker</title>
    <link rel="icon" type="image/png" href="pomodorotablogo.png">
    <link rel="stylesheet" href="css/register.css">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <span class="auth-header-icon"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="icons/lucide-sprite.svg#alarm-clock"></use></svg></span>
            <h1>Create Account</h1>
            <p>Join Time Management & Pomodoro Tracker</p>
        </div>
        
        <div class="register-body">
            <!-- Alert messages -->
            <div id="alertBox" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                    <span class="error-message" id="nameError">Name must be at least 2 characters</span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error-message" id="emailError">Please enter a valid email address</span>
                    <span class="success-message" id="emailSuccess">Email looks good!</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Create a password" required>
                        <button type="button" class="toggle-password" id="togglePassword" title="Show/hide password" aria-label="Show password" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="icons/lucide-sprite.svg#eye"></use></svg></button>
                    </div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <span class="password-strength-text" id="strengthText"></span>
                    <span class="error-message" id="passwordError">Password must be at least 6 characters</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                        <button type="button" class="toggle-password" id="toggleConfirmPassword" title="Show/hide password" aria-label="Show password" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="icons/lucide-sprite.svg#eye"></use></svg></button>
                    </div>
                    <span class="error-message" id="confirmError">Passwords do not match</span>
                    <span class="success-message" id="confirmSuccess">Passwords match!</span>
                </div>

                <button type="submit" class="register-btn">Create Account</button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
