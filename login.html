<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Time Management & Pomodoro Tracker</title>
    <link rel="icon" type="image/png" href="pomodorotablogo.png">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/icons.css">
    <link rel="stylesheet" href="css/buttons.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <span class="auth-header-icon"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="icons/lucide-sprite.svg#alarm-clock"></use></svg></span>
            <h1>Welcome Back!</h1>
            <p>Time Management & Pomodoro Tracker</p>
        </div>
        
        <div class="login-body">
            <!-- Alert messages -->
            <div id="alertBox" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <span class="error-message" id="emailError">Please enter a valid email address</span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword" title="Show/hide password" aria-label="Show password" aria-pressed="false"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="icons/lucide-sprite.svg#eye"></use></svg></button>
                    </div>
                    <span class="error-message" id="passwordError">Password must be at least 6 characters</span>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn">Login</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a href="register.html">Sign up here</a>
            </div>
        </div>
    </div>

    <script src="js/icons.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
